<template>
  <style>
    __BASE_CSS__
    #__ID__-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #__ID__-kicker { position: absolute; left: 192px; top: 236px; }
    #__ID__-title { position: absolute; left: 184px; top: 290px; font-size: 150px; line-height: 0.96; font-weight: 520; color: #F7EFE9; }
    #__ID__-jobs { position: absolute; left: 192px; top: 640px; font-size: 54px; font-weight: 500; letter-spacing: -0.01em; }
    #__ID__-jobs .dot { color: #8E7C76; margin: 0 18px; }
    #__ID__-credit { position: absolute; left: 192px; top: 760px; width: 640px; font-size: 28px; line-height: 1.45; color: #CDBDB5; }
    #__ID__-len { position: absolute; left: 1196px; top: 174px; font-size: 30px; color: #F7EFE9; }
    #__ID__-len span { color: #FF9A86; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
    <svg id="__ID__-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <radialGradient id="__ID__-bolusGlow">
          <stop offset="0" stop-color="#FFE3A0" stop-opacity="1" />
          <stop offset="0.45" stop-color="#FFC857" stop-opacity="0.9" />
          <stop offset="1" stop-color="#FFC857" stop-opacity="0" />
        </radialGradient>
      </defs>
      <path id="__ID__-coil-shadow" d="__COIL_D__" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" transform="translate(0 8)" />
      <path id="__ID__-coil-outer" d="__COIL_D__" fill="none" stroke="#A93B3A" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
      <path id="__ID__-coil-mid" d="__COIL_D__" fill="none" stroke="#E07A70" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
      <path id="__ID__-coil-inner" d="__COIL_D__" fill="none" stroke="#F6B8AA" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" transform="translate(0 -9)" />
      <line id="__ID__-lenline" x1="1040" y1="200" x2="1188" y2="196" stroke="#FF9A86" stroke-width="2" opacity="0" />
      <g id="__ID__-bolus" opacity="0">
        <circle r="34" fill="url(#__ID__-bolusGlow)" />
        <circle r="11" fill="#FFE7B0" />
      </g>
    </svg>
    <div id="__ID__-len" class="mono">5–7 <span>meters</span></div>
    <div id="__ID__-kicker" class="kicker">Gastrointestinal physiology · Lecture 5</div>
    <h1 id="__ID__-title" class="disp"><span class="w" id="__ID__-t1">The</span> <span class="w" id="__ID__-t2">small</span><br><span class="w" id="__ID__-t3">intestine</span></h1>
    <div id="__ID__-jobs">
      <span class="w" id="__ID__-j1" style="color:#FF7A63">Move</span><span class="w dot" id="__ID__-d1">·</span><span class="w" id="__ID__-j2" style="color:#FFC857">Digest</span><span class="w dot" id="__ID__-d2">·</span><span class="w" id="__ID__-j3" style="color:#3FD0BC">Absorb</span>
    </div>
    <div id="__ID__-credit">From the lecture by Prof. Mohammed Alzoghaibi &amp; Dr. Hayam Gad</div>
  </div>
  <script>
    __CUE_LIB__
    const DUR = __DUR__;
    const coil = document.getElementById("__ID__-coil-mid");
    const L = coil.getTotalLength();
    const bolus = document.getElementById("__ID__-bolus");

    const tl = gsap.timeline({ paused: true });
    const tHere = cue("here");
    const tFive = cue("five");
    const tTitle = cue("small intestine");
    const tFollow = cue("follow");
    const tJobs = [cue("moves"), cue("digests"), cue("absorbs")];

    tl.fromTo("#__ID__-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 0.25);
    // the coil draws itself while the voice says "ends up here ... folded, moving tube"
    tl.fromTo(["#__ID__-coil-shadow", "#__ID__-coil-outer", "#__ID__-coil-mid", "#__ID__-coil-inner"], { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: Math.max(2.8, cue("tube") + 0.6 - (tHere - 0.9)), ease: "power2.inOut" }, tHere - 0.9);
    tl.fromTo("#__ID__-lenline", { opacity: 0 }, { opacity: 0.9, duration: 0.25 }, tFive);
    tl.fromTo("#__ID__-len", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, tFive);
    // title, word by word
    tl.fromTo(["#__ID__-t1", "#__ID__-t2", "#__ID__-t3"], { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.09 }, tTitle - 0.25);
    tl.fromTo("#__ID__-credit", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, tTitle + 0.9);
    // one meal travels the whole tube
    tl.fromTo(bolus, { opacity: 0 }, { opacity: 1, duration: 0.3 }, tFollow);
    const prog = { p: 0 };
    const place = () => {
      const pt = coil.getPointAtLength(prog.p * L);
      bolus.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
    };
    place();
    tl.fromTo(prog, { p: 0 }, { p: 0.94, duration: DUR - tFollow - 0.6, ease: "none", onUpdate: place }, tFollow);
    // three jobs land on the words that name them
    tl.fromTo("#__ID__-j1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, tJobs[0] - 0.05);
    tl.fromTo(["#__ID__-d1", "#__ID__-j2"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out", stagger: 0.04 }, tJobs[1] - 0.08);
    tl.fromTo(["#__ID__-d2", "#__ID__-j3"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out", stagger: 0.04 }, tJobs[2] - 0.08);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
