<template>
  <style>
    __BASE_CSS__
    .__ID__-card { position: absolute; inset: 0; opacity: 0; }
    .__ID__-card .kicker { position: absolute; left: 192px; top: 170px; color: #3FD0BC; }
    .__ID__-card .qtext { position: absolute; left: 190px; top: 226px; width: 1540px; font-size: 64px; line-height: 1.12; font-weight: 500; }
    .__ID__-card .timer { position: absolute; left: 192px; top: 470px; width: 1536px; height: 4px; border-radius: 2px; background: rgba(247, 239, 233, 0.12); overflow: hidden; }
    .__ID__-card .bar { width: 100%; height: 100%; background: #FF7A63; transform-origin: 0 50%; transform: scaleX(0); }
    .__ID__-card .opts { position: absolute; left: 192px; top: 530px; width: 1536px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 28px; }
    .__ID__-card .opt { position: relative; height: 128px; border-radius: 20px; border: 2px solid rgba(247, 239, 233, 0.24); background: rgba(247, 239, 233, 0.04); display: flex; align-items: center; gap: 26px; padding: 0 30px; font-size: 36px; font-weight: 500; color: #F7EFE9; }
    .__ID__-card .badge { flex: none; width: 56px; height: 56px; border-radius: 28px; border: 2px solid rgba(247, 239, 233, 0.4); display: flex; align-items: center; justify-content: center; font-family: "JBMono", monospace; font-size: 28px; }
    .__ID__-card .otext { flex: 1; line-height: 1.15; }
    .__ID__-card .tick { flex: none; width: 46px; height: 46px; }
    .__ID__-card .tick path { fill: none; stroke: #0B0608; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1; }
    .__ID__-card .saq { position: absolute; left: 192px; top: 540px; width: 1536px; display: flex; flex-direction: column; gap: 18px; }
    .__ID__-card .saq-label { font-size: 28px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #CDBDB5; }
    .__ID__-card .saq-text { font-family: "Fraunces", serif; font-variation-settings: "opsz" 144, "SOFT" 30; font-size: 60px; line-height: 1.12; color: #3FD0BC; font-weight: 500; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
    __QUIZ__
  </div>
  <script>
    __CUE_LIB__
    const DUR = __DUR__;
    const DATA = __QUIZ_DATA__;
    const tl = gsap.timeline({ paused: true });
    DATA.forEach((d, i) => {
      const n = i + 1;
      const q = part("q" + n), a = part("a" + n);
      const next = part("q" + (n + 1));
      const tIn = Math.max(0.05, q.start - 0.3);
      const tOut = next ? next.start - 0.5 : DUR;
      const qEnd = q.start + q.duration;
      const card = "#q" + n;
      tl.fromTo(card, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, tIn);
      tl.fromTo(card + "-text", { opacity: 0.0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, tIn);
      // countdown while the viewer thinks
      tl.fromTo(card + "-bar", { scaleX: 1 }, { scaleX: 0, duration: a.start - qEnd, ease: "none" }, qEnd);
      if (!d.saq) {
        const opts = [0, 1, 2, 3].map((k) => card + "-o" + k);
        tl.fromTo(opts, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", stagger: 0.07 }, tIn + 0.25);
        // reveal on the answer
        const right = card + "-o" + d.a;
        tl.to(opts.filter((o) => o !== right), { opacity: 0.3, duration: 0.25, ease: "power2.out" }, a.start - 0.05);
        tl.to(right, { backgroundColor: "#3FD0BC", borderColor: "#3FD0BC", color: "#0B0608", duration: 0.18, ease: "power2.out" }, a.start - 0.05);
        tl.to(right + " .badge", { borderColor: "rgba(11,6,8,0.5)", duration: 0.18 }, a.start - 0.05);
        tl.fromTo(card + "-tick" + d.a, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, a.start + 0.05);
      } else {
        tl.fromTo(card + "-saq", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, a.start - 0.05);
      }
      if (next) tl.to(card, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, tOut);
    });
    window.__timelines["__ID__"] = tl;
  </script>
</template>
