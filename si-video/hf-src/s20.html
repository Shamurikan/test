<template>
  <style>
    __BASE_CSS__
    #__ID__-kicker { position: absolute; left: 192px; top: 112px; color: #3FD0BC; }
    #__ID__-title { position: absolute; left: 190px; top: 150px; font-size: 66px; font-weight: 520; }
    #__ID__-list { position: absolute; left: 192px; top: 300px; width: 560px; }
    .__ID__-row { position: relative; display: flex; align-items: baseline; gap: 22px; height: 128px; }
    .__ID__-row .n { font-family: "Fraunces", serif; font-variation-settings: "opsz" 144, "SOFT" 30; font-size: 104px; font-weight: 480; color: #F7EFE9; width: 210px; letter-spacing: -0.03em; }
    .__ID__-row .l { font-size: 30px; line-height: 1.25; color: #CDBDB5; }
    .__ID__-row .hl { position: absolute; left: -24px; top: 6px; width: 600px; height: 118px; border-radius: 18px; background: rgba(63, 208, 188, 0.16); border: 2px solid rgba(63, 208, 188, 0.6); }
    #__ID__-sep { width: 560px; height: 2px; background: rgba(247, 239, 233, 0.25); margin: 8px 0 18px; transform-origin: 0 50%; }
    #__ID__-total .n { color: #3FD0BC; }
    #__ID__-uline { position: absolute; left: 0; top: 116px; width: 200px; height: 5px; border-radius: 3px; background: #3FD0BC; transform-origin: 0 50%; }
    #__ID__-unused-tag { position: absolute; left: 236px; top: -18px; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #3FD0BC; }
    #__ID__-stage { position: absolute; left: 820px; top: 250px; width: 908px; height: 660px; overflow: hidden; border-radius: 28px; }
    #__ID__-stage svg { position: absolute; left: 0; top: 0; width: 908px; height: 660px; }
    .__ID__-slab { position: absolute; font-size: 28px; font-weight: 600; color: #F7EFE9; }
    .__ID__-slab small { display: block; font-size: 28px; font-weight: 500; color: #CDBDB5; }
    #__ID__-area { position: absolute; left: 0; top: 240px; width: 908px; text-align: center; font-size: 132px; font-weight: 500; color: #F7EFE9; }
    #__ID__-area .au { font-size: 74px; color: #3FD0BC; margin-left: 10px; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080">
    <div id="__ID__-kicker" class="kicker">Absorption · surface area</div>
    <h2 id="__ID__-title" class="disp">Why the inside is so big</h2>

    <div id="__ID__-list">
      <div id="__ID__-r1" class="__ID__-row"><span class="n">×3</span><span class="l">circular folds<br>(valvulae conniventes)</span></div>
      <div id="__ID__-r2" class="__ID__-row"><span class="n">×10</span><span class="l">villi</span></div>
      <div id="__ID__-r3" class="__ID__-row"><div id="__ID__-hl" class="hl"></div><span class="n">×20</span><span class="l">microvilli<br>(up to 1000 per cell)</span><div id="__ID__-uline"></div></div>
      <div id="__ID__-sep"></div>
      <div id="__ID__-total" class="__ID__-row"><span class="n" id="__ID__-tot">×600</span><span class="l" id="__ID__-totl">≈ 250 m²<br>a tennis court</span></div>
    </div>

    <div id="__ID__-stage" data-layout-allow-overflow>
      <!-- Layer 1: mucosa strip that folds -->
      <svg id="__ID__-L1" viewBox="0 0 908 660">
        <defs>
          <linearGradient id="__ID__-muc" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F3A99C" />
            <stop offset="0.5" stop-color="#E07A70" />
            <stop offset="1" stop-color="#9E3A3B" />
          </linearGradient>
          <linearGradient id="__ID__-vil" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6B8AA" />
            <stop offset="1" stop-color="#D86D64" />
          </linearGradient>
        </defs>
        <path id="__ID__-fold" fill="url(#__ID__-muc)" d="M0 470 L908 470 L908 660 L0 660 Z" />
        <path id="__ID__-foldEdge" fill="none" stroke="#FFD3C8" stroke-opacity="0.7" stroke-width="3" d="M0 470 L908 470" />
        <path id="__ID__-foldFringe" fill="none" stroke="#F3A99C" stroke-width="9" stroke-dasharray="2.2 2.6" d="M0 470 L908 470" />
        <rect x="0" y="610" width="908" height="50" fill="#5A2128" />
      </svg>
      <!-- Layer 2: a row of villi -->
      <svg id="__ID__-L2" viewBox="0 0 908 660" opacity="0">
        __S20_FLOOR__
        __S20_VILLI__
      </svg>
      <!-- Layer 3: epithelial cells with a brush border -->
      <svg id="__ID__-L3" viewBox="0 0 908 660" opacity="0">
        __S20_CELLS__
        <g id="__ID__-mv">__S20_MV__</g>
      </svg>
      <!-- Layer 4: tennis court -->
      <svg id="__ID__-L4" viewBox="0 0 908 660" opacity="0">
        <g fill="none" stroke="#6FD38A" stroke-width="4" stroke-linecap="round">
          <rect id="__ID__-court" x="114" y="200" width="680" height="312" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="114" y1="234" x2="794" y2="234" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="114" y1="478" x2="794" y2="478" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="454" y1="200" x2="454" y2="512" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="270" y1="234" x2="270" y2="478" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="638" y1="234" x2="638" y2="478" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
          <line class="__ID__-cl" x1="270" y1="356" x2="638" y2="356" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
        </g>
      </svg>
      <div id="__ID__-area" class="disp"><span id="__ID__-areaN">0</span><span class="au">m²</span></div>
      <div id="__ID__-lab1" class="__ID__-slab" style="left:40px; top:56px">Circular folds <small>valvulae conniventes · ×3</small></div>
      <div id="__ID__-lab2" class="__ID__-slab" style="left:40px; top:56px">Villi <small>finger-like projections · ×10</small></div>
      <div id="__ID__-lab3" class="__ID__-slab" style="left:40px; top:56px">Brush border <small>up to 1000 microvilli per cell · ×20</small></div>
      <div id="__ID__-lab4" class="__ID__-slab" style="left:40px; top:56px">≈ 250 m² <small>about the area of a tennis court</small></div>
      <div id="__ID__-lab5" class="__ID__-slab" style="left:40px; top:56px; color:#3FD0BC">Biggest contributor: microvilli <small>the brush border adds ×20</small></div>
    </div>
  </div>
  <script>
    __CUE_LIB__
    const DUR = __DUR__;
    const NS = "http://www.w3.org/2000/svg";
    // villi and cells are static markup (one group per villus so they can grow in turn)
    const villi = Array.from(document.querySelectorAll(".__ID__-vg"));
    const mvs = [document.getElementById("__ID__-mv")];
    // --- the fold profile, rebuilt from an amplitude so the strip can fold up ---
    const fold = document.getElementById("__ID__-fold");
    const edge = document.getElementById("__ID__-foldEdge");
    const amp = { a: 0 };
    const drawFold = () => {
      let top = "";
      for (let x = 0; x <= 908; x += 6) {
        const ph = (x / 908) * 5 + 0.5;
        const fr = ph - Math.floor(ph) - 0.5;
        const k = Math.exp(-Math.pow(fr / 0.2, 2));
        const y = 470 - amp.a * k;
        top += (x === 0 ? "M" : " L") + x + " " + y.toFixed(1);
      }
      edge.setAttribute("d", top);
      document.getElementById("__ID__-foldFringe").setAttribute("d", top);
      fold.setAttribute("d", top + " L908 660 L0 660 Z");
    };
    drawFold();

    const tCirc = cue("circular folds");
    const tVilli = cue("villi");
    const tCell = cue("each epithelial");
    const tMv = cue("microvilli");
    const t600 = cue("six hundred");
    const t250 = cue("two hundred");
    const tBig = cue("biggest");
    const tMv2 = cue("microvilli", 2);

    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, t, dur = 0.2) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: dur, ease: "power3.out" }, t);
    const blurOut = (sel, t, dur = 0.18) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: dur, ease: "power2.in" }, t);
    gsap.set(["#__ID__-r1", "#__ID__-r2", "#__ID__-r3", "#__ID__-total", "#__ID__-lab1", "#__ID__-lab2", "#__ID__-lab3", "#__ID__-lab4", "#__ID__-area", "#__ID__-hl", "#__ID__-lab5"], { opacity: 0 });
    gsap.set("#__ID__-sep", { scaleX: 0 });
    gsap.set("#__ID__-uline", { scaleX: 0 });
    blurIn("#__ID__-kicker", 0.2);
    blurIn("#__ID__-title", 0.3);
    tl.fromTo("#__ID__-L1", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);

    // 1. circular folds: the flat strip folds up (x3)
    tl.fromTo(amp, { a: 0 }, { a: 300, duration: 1.4, ease: "power3.inOut", onUpdate: drawFold }, tCirc - 0.1);
    blurIn("#__ID__-lab1", tCirc);
    blurIn("#__ID__-r1", cue("triple") - 0.1);

    // 2. dive into a fold, villi grow (x10)
    tl.to("#__ID__-L1", { scale: 3.2, x: -120, y: 420, transformOrigin: "50% 40%", filter: "blur(10px)", opacity: 0, duration: 0.6, ease: "power3.in" }, tVilli - 0.55);
    blurOut("#__ID__-lab1", tVilli - 0.4);
    tl.fromTo("#__ID__-L2", { opacity: 0, scale: 0.7, transformOrigin: "50% 80%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, tVilli - 0.05);
    tl.fromTo(villi, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "back.out(1.3)", stagger: 0.05 }, tVilli);
    blurIn("#__ID__-lab2", tVilli + 0.1);
    blurIn("#__ID__-r2", cue("ten") - 0.1);

    // 3. dive into a villus: epithelial cells sprout microvilli (x20)
    tl.to("#__ID__-L2", { scale: 4, transformOrigin: "50% 30%", filter: "blur(10px)", opacity: 0, duration: 0.6, ease: "power3.in" }, tCell - 0.5);
    blurOut("#__ID__-lab2", tCell - 0.4);
    tl.fromTo("#__ID__-L3", { opacity: 0, scale: 0.75, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, tCell);
    tl.fromTo(mvs, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, tMv - 0.3);
    blurIn("#__ID__-lab3", tCell + 0.2);
    blurIn("#__ID__-r3", cue("twenty") - 0.1);

    // 4. total: x600
    tl.fromTo("#__ID__-sep", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t600 - 0.6);
    blurIn("#__ID__-total", t600 - 0.15);
    const tot = { v: 30 };
    const totEl = document.getElementById("__ID__-tot");
    tl.fromTo(tot, { v: 30 }, { v: 600, duration: 1.0, ease: "power2.out", onUpdate: () => (totEl.textContent = "×" + Math.round(tot.v)) }, t600 - 0.1);

    // 5. 250 m2 = a tennis court
    tl.to("#__ID__-L3", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, t250 - 0.35);
    blurOut("#__ID__-lab3", t250 - 0.35);
    tl.fromTo("#__ID__-L4", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t250 - 0.1);
    tl.fromTo("#__ID__-court", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, t250 - 0.1);
    tl.fromTo(".__ID__-cl", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.08 }, t250 + 0.5);
    blurIn("#__ID__-area", t250 + 0.2);
    const area = { v: 0 };
    const areaEl = document.getElementById("__ID__-areaN");
    tl.fromTo(area, { v: 0 }, { v: 250, duration: 1.4, ease: "power2.out", onUpdate: () => (areaEl.textContent = Math.round(area.v)) }, t250 + 0.2);
    blurIn("#__ID__-lab4", cue("tennis") - 0.1);

    // 6. the biggest contributor is the microvilli
    tl.to(["#__ID__-r1", "#__ID__-r2", "#__ID__-total"], { opacity: 0.35, duration: 0.3, ease: "power2.out" }, tBig);
    tl.fromTo("#__ID__-hl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, tBig);
    tl.fromTo("#__ID__-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, tMv2 - 0.05);
    blurOut("#__ID__-lab4", tBig - 0.1);
    blurIn("#__ID__-lab5", tMv2 - 0.1);
    window.__timelines["__ID__"] = tl;
  </script>
</template>
